<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS Companion Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131929;
            --border-color: #222d4a;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --primary: #10b981;
            --primary-hover: #059669;
            --secondary: #3b82f6;
            --font-outfit: 'Outfit', sans-serif;
        }

        body {
            font-family: var(--font-outfit);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.08), transparent 45%),
                        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05), transparent 40%),
                        var(--bg-color);
        }

        .launcher-card {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .logo-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(90deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 8px 0 0 0;
            line-height: 1.5;
        }

        form {
            margin-top: 32px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: var(--font-outfit);
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            font-family: var(--font-outfit);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .presets {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .preset-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .preset-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-tag {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .preset-tag:hover {
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.2);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="launcher-card">
        <div class="logo-container">
            <div class="logo-icon">L</div>
            <h1>LOS Companion</h1>
            <p>Connect your active Loan Origination portal to begin side-by-side diagnostic telemetry logging</p>
        </div>

        <form id="launch-form">
            <div class="input-group">
                <label for="url-input">LOS Domain URL</label>
                <div class="input-wrapper">
                    <input 
                        type="url" 
                        id="url-input" 
                        placeholder="https://your-los.com"
                        required
                        autofocus
                    >
                </div>
            </div>

            <button type="submit">Launch Workspace</button>
        </form>

        <div class="presets">
            <span class="preset-title">Sandbox Presets</span>
            <div class="preset-links">
                <span class="preset-tag" onclick="usePreset('https://your-los.com/login')">Your LOS Portal</span>
                <span class="preset-tag" onclick="usePreset('../mock-los/mock-los.html')">Local Mock Environment</span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('launch-form');
        const input = document.getElementById('url-input');

        form.onsubmit = (e) => {
            e.preventDefault();
            let url = input.value.trim();
            
            // Auto prefix http/https protocol if missing, unless it's a relative path like a mock file
            if (!/^https?:\/\//i.test(url) && !url.startsWith('.') && !url.startsWith('/')) {
                url = 'https://' + url;
            }
            
            // Navigate the viewport
            window.location.href = url;
        };

        function usePreset(url) {
            input.value = url;
            // Short delay for visual feedback before submit
            setTimeout(() => {
                form.requestSubmit();
            }, 200);
        }
    </script>
</body>
</html>
